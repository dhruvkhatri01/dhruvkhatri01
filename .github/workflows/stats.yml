name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Create output directory
        run: mkdir -p profile
      - name: Generate dark stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=dhruvkhatri01&hide_border=true&bg_color=0A101F&title_color=22D3EE&icon_color=A78BFA&text_color=94A3B8&card_width=500&border_radius=12&show_icons=true&hide_rank=true&include_all_commits=true'
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'
      - name: Generate dark top-langs
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=dhruvkhatri01&hide_border=true&bg_color=0A101F&title_color=22D3EE&icon_color=A78BFA&text_color=94A3B8&card_width=500&border_radius=12&layout=compact&langs_count=8'
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'
      - name: Generate light stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=dhruvkhatri01&hide_border=true&bg_color=F8FAFC&title_color=0891B2&icon_color=7C3AED&text_color=334155&card_width=500&border_radius=12&show_icons=true&hide_rank=true&include_all_commits=true'
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'
      - name: Generate light top-langs
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=dhruvkhatri01&hide_border=true&bg_color=F8FAFC&title_color=0891B2&icon_color=7C3AED&text_color=334155&card_width=500&border_radius=12&layout=compact&langs_count=8'
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'
      - name: Save updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats-dark.svg profile/stats-light.svg profile/top-langs-dark.svg profile/top-langs-light.svg
          if git diff --cached --quiet; then
            echo "Stats are already up to date."
            exit 0
          fi
          git commit -m "Update profile stats [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
